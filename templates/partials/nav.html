{% load spa_tags %}
<header id="site-header" class="sticky top-0 z-50 bg-ink text-cream transition-shadow">
  <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-5">
    <a href="{% url 'home' %}" class="font-serif text-2xl text-gold" aria-label="{{ site_settings.business_name }} home">{{ site_settings.business_name }}</a>
    <nav class="hidden items-center gap-7 lg:flex" aria-label="Main">
      <a data-nav href="{% url 'home' %}">Home</a>
      <a data-nav href="{% url 'about' %}">About</a>
      <a data-nav href="{% url 'services' %}">Services</a>
      <a data-nav href="{% url 'pricing' %}">Pricing</a>
      <a data-nav href="{% url 'gallery' %}">Gallery</a>
      <a data-nav href="{% url 'contact' %}">Contact</a>
      <a href="{% wa_link %}" target="_blank" rel="noopener" class="rounded bg-gold px-4 py-2 font-semibold text-ink hover:bg-[#b8954f]">Book on WhatsApp</a>
    </nav>
    <button id="menu-btn" class="p-3 lg:hidden" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-menu">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
  </div>
  <nav id="mobile-menu" class="hidden w-full flex-col border-t border-gold/30 bg-ink px-5 pb-5 lg:hidden" aria-label="Mobile">
    <a data-nav class="py-3" href="{% url 'home' %}">Home</a>
    <a data-nav class="py-3" href="{% url 'about' %}">About</a>
    <a data-nav class="py-3" href="{% url 'services' %}">Services</a>
    <a data-nav class="py-3" href="{% url 'pricing' %}">Pricing</a>
    <a data-nav class="py-3" href="{% url 'gallery' %}">Gallery</a>
    <a data-nav class="py-3" href="{% url 'contact' %}">Contact</a>
    <a href="{% wa_link %}" target="_blank" rel="noopener" class="mt-2 rounded bg-gold px-4 py-3 text-center font-semibold text-ink">Book on WhatsApp</a>
  </nav>
</header>

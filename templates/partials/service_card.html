{% load spa_tags %}
<article class="reveal flex h-full flex-col rounded-lg border border-ink/10 bg-white p-6 shadow-sm transition hover:-translate-y-1 hover:border-gold hover:shadow-md md:p-8">
  <span class="flex h-12 w-12 items-center justify-center rounded-full bg-gold/20 text-ink">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ s.icon_path }}"/></svg>
  </span>
  <h3 class="mt-5 font-serif text-2xl">{{ s.name }}</h3>
  {% if full %}<p class="mt-1 text-sm text-ink/70">{{ s.duration }}</p>{% endif %}
  <p class="mt-3 flex-1">{{ s.description }}</p>
  <p class="mt-5 font-bold text-[#8a6d2f]">{% price s.price %}</p>
  {% if full %}<a href="{% wa_link s.name %}" target="_blank" rel="noopener" aria-label="Book {{ s.name }} on WhatsApp" class="mt-5 inline-block rounded bg-ink px-5 py-3 text-center font-semibold text-cream hover:bg-gold hover:text-ink">Book on WhatsApp</a>{% endif %}
</article>

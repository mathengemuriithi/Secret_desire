{% extends "base.html" %}
{% block content %}
<section class="bg-ink py-20 text-cream md:py-28"><div class="mx-auto max-w-7xl px-5"><h1 class="font-serif text-5xl text-gold md:text-7xl">Gallery</h1></div></section>
<section class="mx-auto max-w-7xl px-5 py-20 md:py-28">
  <div class="mb-10 flex flex-wrap gap-2" role="group" aria-label="Filter gallery">
    <button class="filter-btn rounded px-5 py-3 font-semibold" data-filter="all" aria-pressed="true">All</button>
    <button class="filter-btn rounded px-5 py-3 font-semibold" data-filter="massage" aria-pressed="false">Massage</button>
    <button class="filter-btn rounded px-5 py-3 font-semibold" data-filter="facials" aria-pressed="false">Facials</button>
    <button class="filter-btn rounded px-5 py-3 font-semibold" data-filter="rooms" aria-pressed="false">Rooms</button>
    <button class="filter-btn rounded px-5 py-3 font-semibold" data-filter="team" aria-pressed="false">Team</button>
  </div>
  <div class="masonry">
    {% for g in images %}
    <figure class="gallery-item overflow-hidden rounded" data-cat="{{ g.category }}">
      <button type="button" class="block w-full" data-full="{{ g.image.url }}" aria-label="Open image{% if g.caption %}: {{ g.caption }}{% endif %}">
        <img src="{{ g.image.url }}" alt="{{ g.caption|default:'Photo of the spa' }}" loading="lazy" class="w-full rounded">
      </button>
    </figure>
    {% empty %}<p>No photos have been added yet.</p>{% endfor %}
  </div>
</section>
<div id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
  <button id="lightbox-close" type="button" aria-label="Close image viewer">Close</button>
  <img src="" alt="">
</div>
{% endblock %}

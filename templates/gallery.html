{% extends "base.html" %}
{% load static %}
{% block content %}
<section class="bg-ink py-20 text-cream md:py-28"><div class="mx-auto max-w-7xl px-5"><h1 class="font-serif text-5xl text-gold md:text-7xl">Gallery</h1></div></section>
<section class="mx-auto max-w-7xl px-5 py-20 md:py-28">

  <!-- Filter Buttons -->
  <div class="mb-10 flex flex-wrap gap-2" role="group" aria-label="Filter gallery">
    <button class="filter-btn rounded px-5 py-3 font-semibold" data-filter="all" aria-pressed="true">All</button>
    <button class="filter-btn rounded px-5 py-3 font-semibold" data-filter="massage" aria-pressed="false">Massage</button>
    <button class="filter-btn rounded px-5 py-3 font-semibold" data-filter="facials" aria-pressed="false">Facials</button>
    <button class="filter-btn rounded px-5 py-3 font-semibold" data-filter="rooms" aria-pressed="false">Rooms</button>
    <button class="filter-btn rounded px-5 py-3 font-semibold" data-filter="team" aria-pressed="false">Team</button>
  </div>

  <!-- Masonry Gallery -->
  <div class="masonry">

    <!-- ================= ROOMS ================= -->
    <figure class="gallery-item overflow-hidden rounded" data-cat="rooms">
      <button type="button" class="block w-full" data-full="{% static 'images/gallery/room-1.jpg' %}" aria-label="Open image">
        <img src="{% static 'images/gallery/room-1.jpg' %}" alt="Massage room" loading="lazy" class="w-full rounded">
      </button>
    </figure>
    <figure class="gallery-item overflow-hidden rounded" data-cat="rooms">
      <button type="button" class="block w-full" data-full="{% static 'images/gallery/room-2.jpg' %}" aria-label="Open image">
        <img src="{% static 'images/gallery/room-2.jpg' %}" alt="Massage room" loading="lazy" class="w-full rounded">
      </button>
    </figure>

    <!-- ================= MASSAGE ================= -->
    <figure class="gallery-item overflow-hidden rounded" data-cat="massage">
      <button type="button" class="block w-full" data-full="{% static 'images/gallery/massage-1.jpg' %}" aria-label="Open image">
        <img src="{% static 'images/gallery/massage-1.jpg' %}" alt="Massage treatment" loading="lazy" class="w-full rounded">
      </button>
    </figure>
    <figure class="gallery-item overflow-hidden rounded" data-cat="massage">
      <button type="button" class="block w-full" data-full="{% static 'images/gallery/massage-2.jpg' %}" aria-label="Open image">
        <img src="{% static 'images/gallery/massage-2.jpg' %}" alt="Massage treatment" loading="lazy" class="w-full rounded">
      </button>
    </figure>

    <!-- ================= FACIALS ================= -->
    <figure class="gallery-item overflow-hidden rounded" data-cat="facials">
      <button type="button" class="block w-full" data-full="{% static 'images/gallery/facial-1.jpg' %}" aria-label="Open image">
        <img src="{% static 'images/gallery/facial-1.jpg' %}" alt="Facial treatment" loading="lazy" class="w-full rounded">
      </button>
    </figure>
    <figure class="gallery-item overflow-hidden rounded" data-cat="facials">
      <button type="button" class="block w-full" data-full="{% static 'images/gallery/facial-2.jpg' %}" aria-label="Open image">
        <img src="{% static 'images/gallery/facial-2.jpg' %}" alt="Facial treatment" loading="lazy" class="w-full rounded">
      </button>
    </figure>

    <!-- ================= TEAM (IMAGESTAKE SERIES) ================= -->
    <figure class="gallery-item overflow-hidden rounded" data-cat="team">
      <button type="button" class="block w-full" data-full="{% static 'images/gallery/Imagestake1.jpeg' %}" aria-label="Open image">

      </button>
    </figure>

      <button type="button" class="block w-full" data-full="{% static 'images/gallery/Imagestake9.jpeg' %}" aria-label="Open image">
        <img src="{% static 'images/gallery/Imagestake9.jpeg' %}" alt="Team member" loading="lazy" class="w-full rounded">
      </button>
    </figure>
    <figure class="gallery-item overflow-hidden rounded" data-cat="team">
      <button type="button" class="block w-full" data-full="{% static 'images/gallery/Imagestake10.jpeg' %}" aria-label="Open image">
        <img src="{% static 'images/gallery/Imagestake10.jpeg' %}" alt="Team member" loading="lazy" class="w-full rounded">

    <figure class="gallery-item overflow-hidden rounded" data-cat="team">
      <button type="button" class="block w-full" data-full="{% static 'images/gallery/Imagestake11.jpeg' %}" aria-label="Open image">

      </button>
    </figure>

  </div>
</section>

<!-- Lightbox -->
<div id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
  <button id="lightbox-close" type="button" aria-label="Close image viewer">Close</button>
  <img src="" alt="">
</div>
{% endblock %}
